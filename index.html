<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наш уголок 💕</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Фоновые градиенты -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-top">
                <span class="badge">Для двоих ❤️</span>
                <button id="share-btn" class="icon-btn" title="Отправить в чат">📤</button>
            </div>
            <h1 class="header-title" id="greeting">Наш уголок 💕</h1>
            <p class="header-subtitle">Общие желания, планы и идеи</p>

            <!-- Блок статистики -->
            <div class="stats-grid">
                <div class="stat-card" id="together-card">
                    <div class="stat-label">Вместе дней</div>
                    <div class="stat-value" id="days-together">0</div>
                    <button class="stat-edit" id="edit-together-btn">✏️</button>
                </div>
                <div class="stat-card streak-card">
                    <div class="stat-label">Стрик 🔥</div>
                    <div class="stat-value" id="streak-days">0</div>
                </div>
            </div>
        </header>

        <!-- Кнопки действий -->
        <div class="action-bar">
            <button id="love-btn" class="love-btn">
                <span class="love-heart">❤️</span>
                <span>Я тебя люблю</span>
                <span class="love-count" id="love-count">0</span>
            </button>
            <button id="note-btn" class="note-btn" title="Записка">💌</button>
        </div>

        <!-- Навигация -->
        <nav class="tabs">
            <button class="tab active" data-tab="wishes-tab">🎁 Вишлист</button>
            <button class="tab" data-tab="plans-tab">📅 Планы</button>
            <button class="tab" data-tab="ideas-tab">🎬 Идеи</button>
        </nav>

        <!-- Контент -->
        <main class="content">
            <!-- Вишлист -->
            <section id="wishes-tab" class="tab-content active">
                <div class="stats-row">
                    <span id="wishes-stats">0 из 0</span>
                    <span class="progress-label" id="wishes-progress-label">0%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="wishes-progress"></div></div>

                <div class="add-card-box">
                    <input type="text" id="wish-input" placeholder="Что хочешь в подарок? 🎁">
                    <div class="add-row">
                        <input type="text" id="wish-meta" placeholder="Цена или ссылка">
                        <button id="add-wish-btn" class="primary-btn">+</button>
                    </div>
                </div>
                <div id="wishes-list" class="cards-list"></div>
            </section>

            <!-- Планы -->
            <section id="plans-tab" class="tab-content">
                <div class="stats-row">
                    <span id="plans-stats">0 из 0</span>
                    <span class="progress-label" id="plans-progress-label">0%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="plans-progress"></div></div>

                <div class="add-card-box">
                    <input type="text" id="plan-input" placeholder="Куда сходим? 💫">
                    <div class="add-row">
                        <input type="date" id="plan-meta" class="date-picker">
                        <button id="add-plan-btn" class="primary-btn">+</button>
                    </div>
                </div>
                <div id="plans-list" class="cards-list"></div>
            </section>

            <!-- Идеи -->
            <section id="ideas-tab" class="tab-content">
                <div class="stats-row">
                    <span id="ideas-stats">Идей: 0</span>
                    <button id="random-idea-btn" class="random-btn">🎲 Случайно</button>
                </div>

                <div class="add-card-box">
                    <input type="text" id="idea-input" placeholder="Фильм, игра или место...">
                    <div class="add-row">
                        <select id="idea-category">
                            <option value="movie">🎬 Кино</option>
                            <option value="food">🍕 Еда</option>
                            <option value="date">✨ Свидание</option>
                        </select>
                        <button id="add-idea-btn" class="primary-btn">+</button>
                    </div>
                </div>
                <div id="ideas-list" class="cards-list"></div>
            </section>
        </main>

        <footer class="footer">
            <button class="ghost-btn" id="export-btn">💾 Сохранить</button>
            <button class="ghost-btn" id="import-btn">📥 Загрузить</button>
            <input type="file" id="import-file" accept=".json" hidden>
        </footer>
    </div>

    <!-- Модалка случайной идеи -->
    <div id="random-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-icon">🎲</div>
            <h3>Сегодня выбираем:</h3>
            <p id="random-result-text" class="random-result"></p>
            <span id="random-result-cat" class="random-cat"></span>
            <button id="close-modal-btn" class="primary-btn full-width">Отлично!</button>
        </div>
    </div>

    <!-- Модалка Записки любви -->
    <div id="note-modal" class="modal hidden">
        <div class="modal-content note-content">
            <div class="modal-icon">💌</div>
            <h3>Записка для тебя:</h3>
            <p id="note-text" class="note-text"></p>
            <button id="close-note-btn" class="primary-btn full-width">Обнимаю!</button>
        </div>
    </div>

    <!-- Модалка даты -->
    <div id="date-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-icon">💞</div>
            <h3>Когда мы начали встречаться?</h3>
            <input type="date" id="start-date-input" class="date-input">
            <button id="save-date-btn" class="primary-btn full-width">Сохранить</button>
            <button id="cancel-date-btn" class="ghost-btn full-width mt-8">Отмена</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
