<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейный бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-title">Семейный бот</div>
            <div class="header-subtitle">Вишлист и планы</div>
        </header>

        <!-- Навигация -->
        <nav class="tabs">
            <button class="tab active" data-tab="wishlist">🎁 Вишлист</button>
            <button class="tab" data-tab="plans">📅 Планы</button>
        </nav>

        <!-- Контент -->
        <main class="content">
            <!-- Вишлист -->
            <section id="wishlist" class="tab-content active">
                <div class="add-form">
                    <input type="text" id="wish-input" placeholder="Добавить желание..." autocomplete="off">
                    <button id="add-wish-btn">+</button>
                </div>
                <div id="wishes-list" class="cards-list">
                    <!-- Карточки будут добавляться сюда -->
                </div>
            </section>

            <!-- Планы -->
            <section id="plans" class="tab-content">
                <div class="add-form">
                    <input type="text" id="plan-input" placeholder="Добавить план..." autocomplete="off">
                    <button id="add-plan-btn">+</button>
                </div>
                <div id="plans-list" class="cards-list">
                    <!-- Карточки планов -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
